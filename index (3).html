<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GroupMap</title>
<style>
  body { font-family: sans-serif; margin: 0 auto; padding: 20px; max-width: 400px; }
  input, button { width: 100%; padding: 12px; margin-top: 10px; font-size: 16px; box-sizing: border-box; }
  .screen { display: none; }
  .screen.active { display: block; }
  #status, #msg { font-size: 14px; margin-top: 16px; }
  #msg { color: #c00; }
  #status { color: #555; }
  .code { font-size: 36px; letter-spacing: 6px; text-align: center; background: #eee; padding: 12px; border-radius: 8px; }
  li { padding: 8px 0; border-bottom: 1px solid #ddd; }
</style>
</head>
<body>

<div id="home" class="screen active">
  <h1>GroupMap</h1>
  <input id="name" placeholder="Your name">
  <button id="createBtn">Create Group</button>
  <hr style="margin:30px 0">
  <input id="codeInput" placeholder="6-digit group code" inputmode="numeric" maxlength="6">
  <button id="joinBtn">Join Group</button>
  <p id="msg"></p>
</div>

<div id="group" class="screen">
  <h2>Your group</h2>
  <p>Share this code with friends:</p>
  <div class="code" id="codeShow">------</div>
  <h3 id="count">Members (0/15)</h3>
  <ul id="list"></ul>
  <p>Live map comes on Days 10-12.</p>
  <button id="leaveBtn">Leave group</button>
</div>

<p id="status">Signing in...</p>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, doc, collection, runTransaction, onSnapshot, serverTimestamp }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  import { firebaseConfig } from "./config.js";

  const MAX = 15;
  const $ = (id) => document.getElementById(id);
  const msg = (t) => $("msg").textContent = t || "";
  function show(id) {
    document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
    $(id).classList.add("active");
  }

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  let user = null, currentCode = null, unsubscribe = null;

  onAuthStateChanged(auth, (u) => {
    if (u) {
      user = u;
      $("status").textContent = "Signed in (anonymous)";
    } else {
      signInAnonymously(auth).catch(e => $("status").textContent = "Login failed: " + e.message);
    }
  });

  function getName() {
    const n = $("name").value.trim();
    if (!n) { msg("Please type your name first."); return null; }
    return n;
  }

  function watchGroup(code) {
    currentCode = code;
    $("codeShow").textContent = code;
    show("group");
    unsubscribe = onSnapshot(collection(db, "groups", code, "members"), (snap) => {
      $("count").textContent = "Members (" + snap.size + "/" + MAX + ")";
      $("list").innerHTML = "";
      snap.forEach(d => {
        const li = document.createElement("li");
        li.textContent = d.data().name + (d.id === user.uid ? " (you)" : "");
        $("list").appendChild(li);
      });
    });
  }

  // CREATE GROUP
  $("createBtn").onclick = async () => {
    msg("");
    const name = getName(); if (!name || !user) return;
    try {
      for (let i = 0; i < 5; i++) {
        const code = String(Math.floor(100000 + Math.random() * 900000));
        const gRef = doc(db, "groups", code);
        const ok = await runTransaction(db, async (tx) => {
          const g = await tx.get(gRef);
          if (g.exists()) return false;            // code already used, try another
          tx.set(gRef, { createdBy: user.uid, createdAt: serverTimestamp(), memberCount: 1 });
          tx.set(doc(db, "groups", code, "members", user.uid), { name, joinedAt: serverTimestamp() });
          return true;
        });
        if (ok) { watchGroup(code); return; }
      }
      msg("Could not make a code. Try again.");
    } catch (e) { msg("Error: " + e.message); }
  };

  // JOIN GROUP
  $("joinBtn").onclick = async () => {
    msg("");
    const name = getName(); if (!name || !user) return;
    const code = $("codeInput").value.trim();
    if (!/^\d{6}$/.test(code)) { msg("Enter the 6-digit code."); return; }
    try {
      const gRef = doc(db, "groups", code);
      const mRef = doc(db, "groups", code, "members", user.uid);
      await runTransaction(db, async (tx) => {
        const g = await tx.get(gRef);
        if (!g.exists()) throw new Error("Group not found. Check the code.");
        const m = await tx.get(mRef);
        if (m.exists()) return;                    // already inside
        if (g.data().memberCount >= MAX) throw new Error("Group is full (15 people).");
        tx.update(gRef, { memberCount: g.data().memberCount + 1 });
        tx.set(mRef, { name, joinedAt: serverTimestamp() });
      });
      watchGroup(code);
    } catch (e) { msg(e.message); }
  };

  // LEAVE GROUP
  $("leaveBtn").onclick = async () => {
    try {
      const gRef = doc(db, "groups", currentCode);
      const mRef = doc(db, "groups", currentCode, "members", user.uid);
      if (unsubscribe) unsubscribe();
      await runTransaction(db, async (tx) => {
        const g = await tx.get(gRef);
        const m = await tx.get(mRef);
        if (g.exists() && m.exists()) {
          tx.update(gRef, { memberCount: Math.max(0, g.data().memberCount - 1) });
          tx.delete(mRef);
        }
      });
    } catch (e) { console.log(e); }
    currentCode = null;
    show("home");
  };
</script>

</body>
</html>
