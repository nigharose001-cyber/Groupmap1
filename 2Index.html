<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Live Location Map Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <!-- Leaflet CSS (cdnjs is more widely allowed than unpkg) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #f0f0f0;
      font-family: sans-serif;
    }
    #map {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 1;
    }
    #status {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 9999;
      padding: 10px;
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      font-size: 13px;
      text-align: center;
      box-sizing: border-box;
      pointer-events: none; /* never blocks map touches */
    }
  </style>
</head>
<body>

  <div id="status">Loading map tools...</div>
  <div id="map"></div>

  <!-- Leaflet JS (loaded first, map doesn't depend on Firebase) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>

  <!-- Firebase v8 -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCLIjAdw70O_Dtgb28at7ib66oqgwR33iM",
      authDomain: "live-location-app-f079d.firebaseapp.com",
      databaseURL: "https://live-location-app-f079d-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "live-location-app-f079d",
      storageBucket: "live-location-app-f079d.firebasestorage.app",
      messagingSenderId: "350033227427",
      appId: "1:350033227427:web:222853633c03187d819916",
      measurementId: "G-698HKHXV25"
    };

    function updateStatus(text) {
      document.getElementById("status").textContent = text;
    }

    (function main() {
      // ---------- 1. MAP (independent of Firebase) ----------
      if (typeof L === "undefined") {
        updateStatus("Error: Map library (Leaflet) failed to load. Check internet / host the page over https.");
        return;
      }

      const map = L.map("map", { zoomControl: true }).setView([23.67, 86.15], 5);

      // Keyless tile providers, tried in order. If one fails, the next is used.
      const providers = [
        {
          url: "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
          options: { maxZoom: 19, attribution: "&copy; OpenStreetMap contributors" }
        },
        {
          url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",
          options: { maxZoom: 19, attribution: "Tiles &copy; Esri" }
        }
      ];

      let providerIndex = 0;
      let tiles = null;
      let tileErrors = 0;

      function useProvider(i) {
        if (tiles) map.removeLayer(tiles);
        tileErrors = 0;
        tiles = L.tileLayer(providers[i].url, providers[i].options).addTo(map);
        tiles.on("tileerror", () => {
          tileErrors++;
          if (tileErrors === 4) {
            if (providerIndex < providers.length - 1) {
              providerIndex++;
              useProvider(providerIndex);
            } else {
              updateStatus("Map tiles are blocked. Open this page from a real https site, not a file or preview.");
            }
          }
        });
      }

      useProvider(providerIndex);

      // Fix sizing bugs on mobile / when container size changes
      [100, 500, 1500].forEach(ms => setTimeout(() => map.invalidateSize(), ms));
      window.addEventListener("resize", () => map.invalidateSize());

      updateStatus("Map ready. Connecting to Firebase...");

      // ---------- 2. FIREBASE ----------
      if (typeof firebase === "undefined") {
        updateStatus("Map works, but Firebase failed to load, so live sharing is off.");
        return;
      }

      try {
        firebase.initializeApp(firebaseConfig);
      } catch (e) {
        updateStatus("Firebase Init Error: " + e.message);
        return;
      }

      const markers = {};
      let hasCentered = false;

      firebase.auth().signInAnonymously().then((cred) => {
        const userId = cred.user.uid;
        updateStatus("Logged in! Getting GPS location...");

        const myRef = firebase.database().ref("locations/" + userId);
        myRef.onDisconnect().remove(); // remove your marker when you leave

        // ---------- 3. BROADCAST MY GPS ----------
        if ("geolocation" in navigator) {
          navigator.geolocation.watchPosition(
            (pos) => {
              updateStatus("GPS Active: Broadcasting location live");
              myRef.set({
                lat: pos.coords.latitude,
                lng: pos.coords.longitude,
                timestamp: Date.now()
              });
            },
            (err) => {
              updateStatus("GPS Error: " + err.message + ". Allow location permission and use https.");
            },
            { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
          );
        } else {
          updateStatus("Geolocation not supported by this browser.");
        }

        // ---------- 4. SHOW EVERYONE ----------
        firebase.database().ref("locations").on("value", (snapshot) => {
          const all = snapshot.val() || {};

          // remove markers of users who left
          Object.keys(markers).forEach((id) => {
            if (!all[id]) {
              map.removeLayer(markers[id]);
              delete markers[id];
            }
          });

          Object.keys(all).forEach((id) => {
            const u = all[id];
            if (typeof u.lat !== "number" || typeof u.lng !== "number") return;
            const latLng = [u.lat, u.lng];

            if (id === userId && !hasCentered) {
              map.setView(latLng, 16);
              hasCentered = true;
            }

            if (markers[id]) {
              markers[id].setLatLng(latLng);
            } else {
              markers[id] = L.marker(latLng)
                .addTo(map)
                .bindPopup(id === userId ? "<b>You</b>" : "User: " + id.substring(0, 5));
            }
          });
        }, (err) => {
          updateStatus("Database error: " + err.message + " (check Realtime Database rules)");
        });

      }).catch((error) => {
        updateStatus("Auth Error: " + error.message + " (enable Anonymous sign-in in Firebase)");
      });
    })();
  </script>
</body>
</html>
